name: mcp-recipe-15

# Recipe 15 — Uptime Kuma Sentinel (needs backend)
#
# Requires: Uptime Kuma reachable at KUMA_URL and an API key (Settings →
# API Keys). The key only unlocks the Prometheus-format /metrics endpoint,
# which is read-only by construction. Starts and errors loudly until .env
# is filled.

services:
  kuma-mcp:
    # PLACEHOLDER TAG — pin the current release of the Uptime Kuma MCP server
    image: uptime-kuma-mcp:vX.Y.Z
    environment:
      KUMA_URL: ${KUMA_URL}
      KUMA_API_KEY: ${KUMA_API_KEY}
    ports:
      - "9115:9115"
    restart: unless-stopped

  # Validation helper only — proves KUMA_URL is reachable from a container
  # and the API key unlocks /metrics, then counts the monitors it can see.
  # Never prints the key. Run: docker compose run --rm preflight
  preflight:
    image: library/alpine:3.20
    profiles: ["tools"]
    environment:
      KUMA_URL: ${KUMA_URL}
      KUMA_API_KEY: ${KUMA_API_KEY}
    read_only: true
    command:
      - sh
      - -c
      - |
        set -e
        : "$${KUMA_URL:?set KUMA_URL in .env}"
        : "$${KUMA_API_KEY:?set KUMA_API_KEY in .env}"
        auth=$$(printf ':%s' "$${KUMA_API_KEY}" | base64 | tr -d '\n')
        m=$$(wget -q -T 10 -O- --header "Authorization: Basic $$auth" "$${KUMA_URL}/metrics")
        echo "key OK, monitors reporting status: $$(echo "$$m" | grep -c '^monitor_status{' || true)"
