name: mcp-recipe-09

# Recipe 09 — Grafana Question Answerer (needs backend)
#
# Requires: Grafana with a service-account token holding the Viewer role
# (Administration → Users → Service accounts). Viewer = reads everything,
# touches nothing — the correct default for a metrics reader.

# Hardening baseline (SECURITY.md): non-root, read-only rootfs, no
# capabilities, no privilege escalation, bounded memory/CPU/PIDs.
x-hardening: &hardening
  user: "${PUID:-65534}:${PGID:-65534}"
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  mem_limit: 256m
  cpus: 0.50
  pids_limit: 128

services:
  grafana-mcp:
    <<: *hardening
    # PLACEHOLDER TAG — pin the current release of the grafana MCP server
    image: grafana-mcp:vX.Y.Z
    environment:
      GRAFANA_URL: ${GRAFANA_URL}
      GRAFANA_TOKEN: ${GRAFANA_TOKEN}
    ports:
      # Loopback by default. To reach it from another machine, set
      # MCP_BIND_ADDR in .env to this host's LAN IP (never 0.0.0.0 on a
      # host with a public interface) — SECURITY.md, "Ports".
      - "${MCP_BIND_ADDR:-127.0.0.1}:9109:9109"
    restart: unless-stopped
