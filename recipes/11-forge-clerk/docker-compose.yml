name: mcp-recipe-11

# Recipe 11 — Forge Clerk: Gitea / Forgejo (needs backend)
#
# Requires: a Gitea or Forgejo instance reachable at FORGE_URL and an access
# token from a DEDICATED user, generated with READ-only scopes (repository,
# issue, user). Forgejo is a Gitea fork and serves the same /api/v1 API, so
# one recipe covers both. Starts and errors loudly until .env is filled.

services:
  forge-mcp:
    # PLACEHOLDER TAG — pin the current release of the Gitea/Forgejo MCP server
    image: gitea-mcp:vX.Y.Z
    environment:
      FORGE_URL: ${FORGE_URL}
      FORGE_TOKEN: ${FORGE_TOKEN}
    ports:
      - "9111:9111"
    restart: unless-stopped

  # Validation helper only — proves FORGE_URL is reachable from a container
  # and the token is accepted, then exits. Prints the token's login, never
  # the token. Run: docker compose run --rm preflight
  preflight:
    image: library/alpine:3.20
    profiles: ["tools"]
    environment:
      FORGE_URL: ${FORGE_URL}
      FORGE_TOKEN: ${FORGE_TOKEN}
    read_only: true
    command:
      - sh
      - -c
      - |
        set -e
        : "$${FORGE_URL:?set FORGE_URL in .env}"
        : "$${FORGE_TOKEN:?set FORGE_TOKEN in .env}"
        v=$$(wget -q -T 10 -O- "$${FORGE_URL}/api/v1/version")
        echo "reachable: $$v"
        me=$$(wget -q -T 10 -O- --header "Authorization: token $${FORGE_TOKEN}" "$${FORGE_URL}/api/v1/user")
        echo "token OK, acting as: $$(echo "$$me" | grep -o '"login":"[^"]*"')"
