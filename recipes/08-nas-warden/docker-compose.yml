name: mcp-recipe-08

# Recipe 08 — NAS Health Warden (needs backend)
#
# Requires: TrueNAS SCALE with an API key for a dedicated user, READ-ONLY
# (book, Chapter 5 — storage servers get reads, full stop).

# Hardening baseline (SECURITY.md): non-root, read-only rootfs, no
# capabilities, no privilege escalation, bounded memory/CPU/PIDs.
x-hardening: &hardening
  user: "${PUID:-65534}:${PGID:-65534}"
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  mem_limit: 256m
  cpus: 0.50
  pids_limit: 128

services:
  truenas-mcp:
    <<: *hardening
    # PLACEHOLDER TAG — pin the current release of the community truenas-mcp
    image: truenas-mcp:vX.Y.Z
    environment:
      TN_URL: ${TN_URL}      # wss://truenas.local/websocket
      TN_KEY: ${TN_KEY}
    ports:
      # Loopback by default. To reach it from another machine, set
      # MCP_BIND_ADDR in .env to this host's LAN IP (never 0.0.0.0 on a
      # host with a public interface) — SECURITY.md, "Ports".
      - "${MCP_BIND_ADDR:-127.0.0.1}:9108:9108"
    restart: unless-stopped
