name: mcp-recipe-06

# Recipe 06 — Radarr Butler (needs backend)
#
# THE *ARR PATTERN: for Sonarr/Prowlarr/Lidarr, duplicate this service with
# the family's MCP server image, a new container/port, and that app's API
# key. One server per app — never share (book, Chapter 5).

# Hardening baseline (SECURITY.md): non-root, read-only rootfs, no
# capabilities, no privilege escalation, bounded memory/CPU/PIDs.
x-hardening: &hardening
  user: "${PUID:-65534}:${PGID:-65534}"
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  mem_limit: 256m
  cpus: 0.50
  pids_limit: 128

services:
  radarr-mcp:
    <<: *hardening
    # PLACEHOLDER TAG — pin the current release of the community arr-mcp
    image: arr-mcp:vX.Y.Z
    environment:
      ARR_URL: ${ARR_URL}
      ARR_KEY: ${ARR_KEY}
    ports:
      # Loopback by default. To reach it from another machine, set
      # MCP_BIND_ADDR in .env to this host's LAN IP (never 0.0.0.0 on a
      # host with a public interface) — SECURITY.md, "Ports".
      - "${MCP_BIND_ADDR:-127.0.0.1}:9106:9106"
    restart: unless-stopped
