name: mcp-recipe-12

# Recipe 12 — Paperless-ngx Archivist (needs backend)
#
# Requires: Paperless-ngx reachable at PAPERLESS_URL and an API auth token
# belonging to a DEDICATED user that has only "view" permissions. Your
# archive is tax returns, medical letters and contracts — the assistant
# reads, it never edits, deletes or re-tags. Starts and errors loudly until
# .env is filled.

services:
  paperless-mcp:
    # PLACEHOLDER TAG — pin the current release of the Paperless-ngx MCP server
    image: paperless-mcp:vX.Y.Z
    environment:
      PAPERLESS_URL: ${PAPERLESS_URL}
      PAPERLESS_TOKEN: ${PAPERLESS_TOKEN}
    ports:
      - "9112:9112"
    restart: unless-stopped

  # Validation helper only — proves PAPERLESS_URL is reachable from a
  # container and the token is accepted, then prints how many documents the
  # token can see. Never prints the token. Run: docker compose run --rm preflight
  preflight:
    image: library/alpine:3.20
    profiles: ["tools"]
    environment:
      PAPERLESS_URL: ${PAPERLESS_URL}
      PAPERLESS_TOKEN: ${PAPERLESS_TOKEN}
    read_only: true
    command:
      - sh
      - -c
      - |
        set -e
        : "$${PAPERLESS_URL:?set PAPERLESS_URL in .env}"
        : "$${PAPERLESS_TOKEN:?set PAPERLESS_TOKEN in .env}"
        docs=$$(wget -q -T 10 -O- --header "Authorization: Token $${PAPERLESS_TOKEN}" "$${PAPERLESS_URL}/api/documents/?page_size=1")
        echo "token OK, documents visible to this user: $$(echo "$$docs" | grep -o '"count":[0-9]*')"
