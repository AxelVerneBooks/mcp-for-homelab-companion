name: mcp-recipe-01

# Recipe 01 — Read-Only Media Librarian (works OOTB, stdio transport)
#
# TRANSPORT NOTE (book, Chapter 3): the reference filesystem server is a
# stdio MCP server — it has NO port and is NOT reachable over HTTP. Your
# client spawns it as a subprocess; that's the whole point of stdio.
# This compose file therefore *validates* the setup (image pull, volume
# mount, command shape). The wiring happens in your client config.
#
# MEDIA_DIR (from .env) picks the tree; unset, it falls back to the
# baked-in ./demo-media so the recipe works out of the box.

services:
  media-mcp:
    # Reference filesystem server (modelcontextprotocol/servers, src/filesystem).
    # 1.0.2 is newer than the image's `latest` tag — pin the version, never `latest`.
    image: mcp/filesystem:1.0.2
    # Allowed directories are passed as CLI args (the container-side path).
    command: ["/media"]
    stdin_open: true    # stdio server: keep stdin open for `docker compose run`
    volumes:
      - ${MEDIA_DIR:-./demo-media}:/media:ro
    # Chapter 7 rule: a read-only librarian has no business on any network.
    network_mode: none

  # Validation helper only — checks the mount is readable and exits 0.
  # Run: docker compose run --rm mount-check
  mount-check:
    image: alpine:3.24.2
    profiles: ["tools"]
    volumes:
      - ${MEDIA_DIR:-./demo-media}:/media:ro
    command: ["sh", "-c", "test -d /media && echo 'mount OK (read-only)' && ls -A /media | head && ! touch /media/.write-test 2>/dev/null && echo 'write blocked OK'"]
    read_only: true
    network_mode: none
