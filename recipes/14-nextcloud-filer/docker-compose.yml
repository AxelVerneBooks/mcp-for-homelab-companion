name: mcp-recipe-14

# Recipe 14 — Nextcloud Filer (needs backend)
#
# Requires: Nextcloud reachable at NC_URL (hostname listed in Nextcloud's
# trusted_domains) and an app password for a DEDICATED user that only has
# read-only shares of the folders you choose. Starts and errors loudly until
# .env is filled.

services:
  nextcloud-mcp:
    # PLACEHOLDER TAG — pin the current release of the Nextcloud MCP server
    image: nextcloud-mcp:vX.Y.Z
    environment:
      NC_URL: ${NC_URL}
      NC_USER: ${NC_USER}
      NC_APP_PASSWORD: ${NC_APP_PASSWORD}
    ports:
      - "9114:9114"
    restart: unless-stopped

  # Validation helper only — proves NC_URL is reachable and trusted, and the
  # app password is accepted, then prints the user id it authenticated as.
  # Never prints the password. Run: docker compose run --rm preflight
  preflight:
    image: library/alpine:3.20
    profiles: ["tools"]
    environment:
      NC_URL: ${NC_URL}
      NC_USER: ${NC_USER}
      NC_APP_PASSWORD: ${NC_APP_PASSWORD}
    read_only: true
    command:
      - sh
      - -c
      - |
        set -e
        : "$${NC_URL:?set NC_URL in .env}"
        : "$${NC_USER:?set NC_USER in .env}"
        : "$${NC_APP_PASSWORD:?set NC_APP_PASSWORD in .env}"
        st=$$(wget -q -T 10 -O- "$${NC_URL}/status.php")
        echo "reachable: $$(echo "$$st" | grep -o '"installed":[a-z]*'), $$(echo "$$st" | grep -o '"maintenance":[a-z]*')"
        auth=$$(printf '%s:%s' "$${NC_USER}" "$${NC_APP_PASSWORD}" | base64 | tr -d '\n')
        me=$$(wget -q -T 10 -O- --header "Authorization: Basic $$auth" --header "OCS-APIRequest: true" "$${NC_URL}/ocs/v2.php/cloud/user?format=json")
        echo "app password OK, acting as: $$(echo "$$me" | grep -o '"id":"[^"]*"' | head -n1)"
